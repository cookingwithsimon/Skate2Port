# Function boundary overrides for Skate 2 codegen.

# Redirect the CRT setjmp/longjmp to native versions. Without this the
# recompiled setjmp stub returns non-zero, so luaD_rawrunprotected never runs
# f_luaopen and the Lua state is left uninitialised.
setjmp_address = 0x82CDE7C0
longjmp_address = 0x82C85590

